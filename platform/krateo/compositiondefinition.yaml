# Registra il blueprint in Krateo: core-provider genera la CRD
# onlineboutiqueenvs.composition.krateo.io (versione v0-1-0) dal values.schema.json
# e avvia un composition-dynamic-controller dedicato.
# Il chart è il pacchetto in platform/krateo/dist/ (helm package platform/krateo/blueprint):
# Krateo lo scarica via HTTPS, nessun registry necessario.
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: online-boutique-env
  namespace: krateo-system
spec:
  chart:
    url: https://raw.githubusercontent.com/ihPax/online-boutique-platform/main/platform/krateo/dist/online-boutique-env-0.1.0.tgz
