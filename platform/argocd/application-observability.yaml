apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique-observability
  labels:
    app.kubernetes.io/part-of: online-boutique
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: online-boutique
  source:
    repoURL: https://github.com/ihPax/online-boutique-platform.git
    targetRevision: main
    path: platform/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
