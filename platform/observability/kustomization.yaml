# Risorse di osservabilità condivise tra gli ambienti, nel namespace dello stack.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - prometheusrule-boutique.yaml
configMapGenerator:
  - name: grafana-dashboard-online-boutique
    files:
      - online-boutique.json=dashboards/online-boutique.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: online-boutique
