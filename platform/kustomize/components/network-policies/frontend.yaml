apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller (Traefik su k3s/k3d sta in kube-system; ingress-nginx su kind).
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [kube-system, traefik, ingress-nginx]
      ports:
        - port: 8080
          protocol: TCP
    # Load generator nello stesso namespace.
    - from:
        - podSelector:
            matchLabels:
              app: loadgenerator
      ports:
        - port: 8080
          protocol: TCP
    # Scrape di Prometheus solo sulla porta metriche.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - {}
