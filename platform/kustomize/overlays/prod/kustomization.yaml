apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique-prod

resources:
- namespace.yaml
- ../../base
- frontend-hpa.yaml
- frontend-pdb.yaml

  # In prod niente traffico sintetico.
components:
- ../../components/guardrails
- ../../components/monitoring
- ../../components/team-rbac
- ../../../../kustomize/components/without-loadgenerator

labels:
- includeTemplates: true
  pairs:
    app.kubernetes.io/environment: prod

  # Senza loadgenerator la sua NetworkPolicy upstream non serve.
patches:
- path: frontend.yaml
- path: resourcequota.yaml
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: boutique.homelab.local
    - op: replace
      path: /spec/tls/0/hosts/0
      value: boutique.homelab.local
  target:
    kind: Ingress
    name: frontend
- patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: loadgenerator
  target:
    kind: NetworkPolicy
    name: loadgenerator

# Promosso da dev tramite il workflow "promote-to-prod" (PR revisionata).
images:
- name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
  newName: ghcr.io/ihpax/online-boutique-platform/frontend
  newTag: sha-a1b745d
