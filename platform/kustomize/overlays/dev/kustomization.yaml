apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique-dev

resources:
- namespace.yaml
- ../../base
- role-operator.yaml

components:
- ../../components/guardrails
- ../../components/monitoring
- ../../components/team-rbac

labels:
- includeTemplates: true
  pairs:
    app.kubernetes.io/environment: dev

patches:
- path: frontend.yaml
- path: loadgenerator.yaml
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: boutique-dev.homelab.local
    - op: replace
      path: /spec/tls/0/hosts/0
      value: boutique-dev.homelab.local
  target:
    kind: Ingress
    name: frontend

# Aggiornato dalla pipeline (build-frontend.yml) a ogni build su main.
images:
- name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
  newName: ghcr.io/ihpax/online-boutique-platform/frontend
  newTag: sha-a1b745d
