# Solo in dev: il team può riavviare deployment, cancellare pod e fare port-forward.
# Le modifiche persistenti passano comunque da Git (Argo CD selfHeal).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: boutique-operator
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boutique-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boutique-operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: boutique-team
