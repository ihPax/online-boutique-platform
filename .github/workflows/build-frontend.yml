# Build del frontend su main: immagine su GHCR taggata con lo SHA, scan Trivy,
# poi aggiornamento del tag nell'overlay dev. Argo CD vede il commit e fa il rollout.
name: build-frontend

on:
  push:
    branches: [main]
    paths:
      - src/frontend/**
      - .github/workflows/build-frontend.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-frontend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${repo}/frontend" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local, for scan)
        uses: docker/build-push-action@v7
        with:
          context: src/frontend
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: src/frontend
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - name: Update dev overlay
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz" | tar xz -C "$RUNNER_TEMP" && export PATH="$RUNNER_TEMP:$PATH"
          cd platform/kustomize/overlays/dev
          kustomize edit set image \
            "us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          cd -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/kustomize/overlays/dev/kustomization.yaml
          git diff --cached --quiet && { echo "nothing to update"; exit 0; }
          git commit -m "deploy(dev): frontend ${{ steps.meta.outputs.tag }}"
          git push
